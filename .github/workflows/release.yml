name: Release APK

# Triggers on every push to main.
# Builds a signed release APK and creates a GitHub Release with the APK attached.
on:
  push:
    branches:
      - main

jobs:
  build-and-release:
    name: Build & Release
    runs-on: ubuntu-latest
    # Grant write permission so GITHUB_TOKEN can create releases and upload APKs.
    # Default token is read-only — without this you get "Resource not accessible by integration".
    permissions:
      contents: write

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so we can generate changelogs

      # ── 2. Java 17 ───────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ── 3. Decode release keystore ───────────────────────────────────────────
      # Keystore is stored as a base64 string in GitHub Secrets (never in git).
      - name: Decode release keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ${{ runner.temp }}/routepix-release.jks

      # ── 4. Decode google-services.json ───────────────────────────────────────
      # google-services.json contains Firebase credentials so it is gitignored.
      # Stored as BASE64 in GitHub Secrets (same as keystore) — avoids JSON
      # corruption that happens when using echo with special characters/newlines.
      - name: Decode google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > app/google-services.json

      # ── 5. Read version from build.gradle.kts ───────────────────────────────
      - name: Extract version name and code
        id: version
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts)
          echo "name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION_NAME" >> $GITHUB_OUTPUT

      # ── 6. Make gradlew executable ───────────────────────────────────────────
      # Windows doesn't preserve Unix file permissions — gradlew arrives on the
      # Linux runner without the execute bit, causing "Permission denied" (exit 126).
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # ── 7. Build signed release APK ──────────────────────────────────────────
      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/routepix-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      # ── 8. Rename APK to include version ─────────────────────────────────────
      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/RoutePix-v${{ steps.version.outputs.name }}.apk

      # ── 9. Generate changelog from commit messages ───────────────────────────
      # Collects commit subjects since the last tag.
      # Filters out internal/tooling commits (ci:, chore:, docs:, build:, test:)
      # so only user-facing changes appear in the release notes.
      - name: Generate changelog
        id: changelog
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            RAW=$(git log --pretty=format:"%s" | head -30)
          else
            RAW=$(git log $LAST_TAG..HEAD --pretty=format:"%s")
          fi

          # WHITELIST: only include feat: and fix: commits — anything else
          # (Update README.md, ci:, chore:, docs:, etc.) is excluded automatically.
          COMMITS=$(echo "$RAW" | grep -E '^(feat|fix)(\(.+\))?[!:]' | sed 's/^/- /')

          # If no feat/fix commits, show a generic message
          if [ -z "$COMMITS" ]; then
            COMMITS="- Internal improvements and fixes"
          fi

          echo "changes<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # ── 10. Create GitHub Release ─────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: "RoutePix v${{ steps.version.outputs.name }}"
          body: |
            ## What's new in v${{ steps.version.outputs.name }}

            ${{ steps.changelog.outputs.changes }}

            ---
            **Build info:** versionCode `${{ steps.version.outputs.code }}`
          files: app/build/outputs/apk/release/RoutePix-v${{ steps.version.outputs.name }}.apk
          make_latest: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 11. Clean up secrets from disk ───────────────────────────────────────
      - name: Clean up sensitive files
        if: always()
        run: |
          rm -f ${{ runner.temp }}/routepix-release.jks
          rm -f app/google-services.json
