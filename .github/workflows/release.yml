name: Release APK

# Triggers on every push to main.
# Builds a signed release APK and creates a GitHub Release with the APK attached.
on:
  push:
    branches:
      - main

jobs:
  build-and-release:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so we can generate changelogs

      # ── 2. Java 17 ───────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ── 3. Decode keystore from GitHub Secret ────────────────────────────────
      # The keystore is stored as a base64-encoded string in GitHub Secrets.
      # We decode it to a temp file and pass its path to Gradle via env vars.
      - name: Decode release keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ${{ runner.temp }}/routepix-release.jks

      # ── 4. Read version from build.gradle.kts ───────────────────────────────
      - name: Extract version name and code
        id: version
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts)
          echo "name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION_NAME" >> $GITHUB_OUTPUT

      # ── 5. Build signed release APK ──────────────────────────────────────────
      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/routepix-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      # ── 6. Rename APK to include version ─────────────────────────────────────
      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/RoutePix-v${{ steps.version.outputs.name }}.apk

      # ── 7. Generate changelog from commit messages ───────────────────────────
      # Gets commit messages since the last tag (or all commits if no tags yet)
      - name: Generate changelog
        id: changelog
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s" | head -20)
          else
            COMMITS=$(git log $LAST_TAG..HEAD --pretty=format:"- %s")
          fi
          echo "changes<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # ── 8. Create GitHub Release ─────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: "RoutePix v${{ steps.version.outputs.name }}"
          body: |
            ## What's new in v${{ steps.version.outputs.name }}

            ${{ steps.changelog.outputs.changes }}

            ---
            **Build info:** versionCode `${{ steps.version.outputs.code }}`
          files: app/build/outputs/apk/release/RoutePix-v${{ steps.version.outputs.name }}.apk
          make_latest: true
          # If the tag already exists (re-push without version bump), update the release
          update_existing_release: true
          # Don't fail if tag already exists — just update
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 9. Clean up keystore ─────────────────────────────────────────────────
      - name: Clean up keystore
        if: always()
        run: rm -f ${{ runner.temp }}/routepix-release.jks
